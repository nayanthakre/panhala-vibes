<div class="flex min-h-dvh flex-col">
  <app-navbar />

  <main class="flex-1">
    <app-page-hero
      eyebrow="Kolhapur • Maharashtra"
      title="Panhala Explorer"
      subtitle="Discover the history, nature and soul of Panhala — forts, trails, food and local life."
      [image]="images.heroPanhala"
      alt="Panhala Fort ramparts above the misty Sahyadri hills"
    >
      <a routerLink="/explore" class="btn-base btn-gold">Start Exploring <span class="arrow">→</span></a>
      <a routerLink="/plan" class="btn-base btn-ghost-light">Plan My Visit</a>
    </app-page-hero>

    <section class="container-page py-16 sm:py-20">
      <app-reveal>
        <app-section-heading
          eyebrow="Must Visit"
          title="Places to explore"
          subtitle="A first look at the fort, temples and hidden corners of Panhala."
        >
          <a routerLink="/explore" class="btn-base btn-outline">View all</a>
        </app-section-heading>
      </app-reveal>

      <div class="mt-10 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
        @for (place of featuredPlaces; track place.slug; let i = $index) {
          <app-reveal [delay]="i * 80">
            <app-place-card [place]="place" />
          </app-reveal>
        }
      </div>
    </section>

    <router-outlet />
  </main>

  <app-footer />
</div>
