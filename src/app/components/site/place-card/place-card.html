<article class="surface-card surface-card-hover group flex flex-col">
  <div class="relative aspect-[4/3] overflow-hidden">
    <img
      [src]="place().image"
      [alt]="place().name + ', Panhala'"
      loading="lazy"
      width="1024"
      height="768"
      class="zoom-img h-full w-full object-cover"
    />
    <div class="image-overlay pointer-events-none absolute inset-0 opacity-70"></div>
    <span class="badge-heritage absolute left-4 top-4 group-hover:bg-gold-gradient">
      {{ place().category }}
    </span>
  </div>

  <div class="flex flex-1 flex-col gap-3 p-5">
    <h3 class="text-display text-xl text-foreground">{{ place().name }}</h3>
    <p class="text-sm leading-relaxed text-muted-foreground">{{ place().description }}</p>

    <div
      class="mt-auto flex flex-wrap items-center gap-x-4 gap-y-1 border-t border-border pt-4 text-xs font-semibold text-muted-foreground"
    >
      <span>📍 {{ place().distance }}</span>
      <span>⏱ {{ place().duration }}</span>
    </div>

    <a
      routerLink="/explore"
      [fragment]="place().slug"
      class="btn-base btn-outline w-full sm:w-auto"
      [attr.aria-label]="'Explore ' + place().name"
    >
      Explore <span class="arrow">→</span>
    </a>
  </div>
</article>
