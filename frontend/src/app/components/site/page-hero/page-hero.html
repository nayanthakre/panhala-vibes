<section class="relative isolate w-full min-h-[calc(100dvh-4rem)] flex flex-col justify-center overflow-hidden">
  <img
    [src]="image()"
    [alt]="alt()"
    width="1920"
    height="1080"
    class="absolute inset-0 -z-20 h-full w-full object-cover"
  />
  <div class="image-overlay absolute inset-0 -z-10"></div>
  <div class="container-page relative z-10 py-16 sm:py-24 lg:py-28">
    <p class="eyebrow text-xs sm:text-sm text-gold-soft">{{ eyebrow() }}</p>
    <h1 class="text-display mt-3 max-w-3xl text-3xl sm:text-5xl lg:text-6xl text-cream">
      {{ title() }}
    </h1>
    <p class="mt-3 sm:mt-4 max-w-xl text-sm sm:text-base lg:text-lg leading-relaxed text-sand/90">
      {{ subtitle() }}
    </p>
    <div class="mt-6 sm:mt-8 flex flex-col sm:flex-row flex-wrap gap-3">
      <ng-content />
    </div>
  </div>
</section>
