@if (loading()) {
  <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
    @for (i of [0, 1, 2]; track i) {
      <div class="surface-card h-48 animate-pulse p-6">
        <div class="flex items-center gap-3">
          <div class="h-11 w-11 rounded-full bg-muted"></div>
          <div class="flex-1 space-y-2">
            <div class="h-4 w-28 rounded bg-muted"></div>
            <div class="h-3 w-16 rounded bg-muted"></div>
          </div>
        </div>
        <div class="mt-4 h-3 w-20 rounded bg-muted"></div>
        <div class="mt-3 h-4 w-3/4 rounded bg-muted"></div>
        <div class="mt-2 h-3 w-full rounded bg-muted"></div>
      </div>
    }
  </div>
} @else if (!reviews().length) {
  <div class="surface-card p-8 text-center text-muted-foreground sm:p-12">
    <span class="text-3xl">✍️</span>
    <p class="mt-3 text-base">No reviews yet — be the first to share your Panhala story.</p>
  </div>
} @else {
  <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
    @for (r of reviews(); track r.id; let i = $index) {
      <app-reveal [delay]="i * 60">
        <app-review-card [review]="r" />
      </app-reveal>
    }
  </div>
}
